<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rádio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#08090B">
<meta name="apple-mobile-web-app-title" content="Minha Rádio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  @property --hue { syntax:"<number>"; inherits:true; initial-value:172; }
  @property --hh  { syntax:"<number>"; inherits:true; initial-value:172; }
  :root{
    --black:#08090B; --panel:#121418; --hover:#1C1F25; --raise:#23272E; --line:#2A2F37;
    --txt:#F3F4F6; --mut:#A3A9B4; --dim:#6B7280;
    --acc:hsl(var(--hue) 75% 60%);
    --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    transition:--hue 1s ease;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:var(--black); color:var(--txt); font:14px/1.45 var(--font); -webkit-font-smoothing:antialiased; overflow:hidden; font-feature-settings:"tnum"}
  button,input{font:inherit; color:inherit}
  button{cursor:pointer; background:none; border:0; padding:0}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:6px}
  [hidden]{display:none !important}
  .ic{width:20px; height:20px; flex:none}

  .app{display:grid; grid-template-columns:280px minmax(0,1fr) 320px; grid-template-rows:minmax(0,1fr) 80px; gap:8px; height:100vh; padding:8px 8px 0}
  .app.np-off{grid-template-columns:280px minmax(0,1fr)}
  .app.np-off .np{display:none}
  .panel{background:var(--panel); border-radius:10px; min-height:0; overflow:hidden}

  /* ================= barra lateral ================= */
  .side{display:flex; flex-direction:column; gap:8px; min-height:0}
  .side .top{padding:14px 10px}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 10px 14px; font-weight:700; font-size:16px; letter-spacing:-.2px}
  .brand img{width:30px; height:30px; border-radius:8px}
  .nav{display:flex; align-items:center; gap:16px; width:100%; padding:9px 12px; border-radius:6px; color:var(--mut); font-weight:600; font-size:15px; transition:color .15s}
  .nav:hover{color:var(--txt)}
  .nav[aria-current="true"]{color:var(--txt)}
  .lib{flex:1; display:flex; flex-direction:column}
  .lib-head{display:flex; align-items:center; gap:10px; padding:14px 18px 8px; color:var(--mut); font-weight:600; font-size:15px}
  .lib-head svg{color:var(--mut)}
  .chips{display:flex; gap:8px; padding:6px 16px 10px; flex-wrap:wrap}
  .chip{height:32px; padding:0 13px; border-radius:999px; background:var(--raise); font-size:13px; font-weight:500; transition:background .15s; white-space:nowrap}
  .chip:hover{background:#2D323A}
  .chip[aria-pressed="true"]{background:var(--txt); color:var(--black)}
  .lib-list{flex:1; overflow-y:auto; padding:0 8px 10px; scrollbar-width:thin; scrollbar-color:var(--raise) transparent}
  .li{display:flex; align-items:center; gap:12px; width:100%; padding:7px 8px; border-radius:6px; text-align:left; position:relative}
  .li:hover{background:var(--hover)}
  .li .art{width:48px; height:48px; border-radius:5px; --s:48px}
  .li .tx{min-width:0; flex:1}
  .li .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .li .sb{font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .li[aria-current="true"] .nm{color:var(--acc)}
  .li.empty .art{background:var(--raise) !important; color:var(--dim)}
  .li.empty .nm{color:var(--dim); font-weight:400}
  .li.over{box-shadow:inset 0 0 0 2px var(--acc)}
  .li.dragging{opacity:.4}
  .li .vol-ic{color:var(--acc)}

  /* ================= área principal ================= */
  .main{position:relative; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--raise) transparent}
  .main::before{content:""; position:absolute; inset:0 0 auto 0; height:340px; pointer-events:none;
    background:linear-gradient(hsl(var(--hh) 60% 38% / .75), transparent); transition:--hh .8s}
  .bar{position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:10px; padding:14px 24px; transition:background .2s}
  .bar.solid{background:hsl(var(--hh) 30% 14% / .96); backdrop-filter:blur(10px)}
  .back{width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center}
  .back:disabled{opacity:.35; cursor:default}
  .search{position:relative; flex:1; max-width:440px}
  .search input{width:100%; height:44px; border-radius:999px; border:2px solid transparent; background:var(--raise); padding:0 42px 0 46px; outline:none; font-size:15px}
  .search input:hover{background:#2D323A}
  .search input:focus{border-color:var(--txt); background:var(--raise)}
  .search input::placeholder{color:var(--dim)}
  .search input::-webkit-search-cancel-button{display:none}
  .search .ic{position:absolute; left:14px; top:12px; color:var(--mut)}
  .search .clear{position:absolute; right:12px; top:11px; width:22px; height:22px; color:var(--mut)}
  .bar .chips{padding:0; margin-left:auto; flex-wrap:nowrap}
  .content{position:relative; padding:4px 24px 40px}

  h1.greet{margin:8px 0 18px; font-size:30px; font-weight:700; letter-spacing:-.6px}
  .quick{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-bottom:10px}
  .qk{display:flex; align-items:center; height:64px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; text-align:left; position:relative; transition:background .2s}
  .qk:hover{background:rgba(255,255,255,.16)}
  .qk .art{width:64px; height:64px; flex:none; --s:64px; border-radius:0}
  .qk .nm{padding:0 52px 0 14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .qk .tag{position:absolute; top:6px; right:8px; font-size:11px; color:var(--mut)}
  .qk .fab{position:absolute; right:10px; width:36px; height:36px; opacity:0; translate:0 4px}
  .qk:hover .fab,.qk:focus-visible .fab{opacity:1; translate:0 0}
  .qk[aria-current="true"] .nm{color:var(--acc)}
  .qk.empty{background:rgba(255,255,255,.03); border:1px dashed rgba(255,255,255,.08); cursor:default}
  .qk.empty .art{background:transparent !important; color:var(--dim)}
  .qk.empty .nm{color:var(--dim); font-weight:400}
  .bank-row{display:flex; align-items:center; gap:10px; margin:0 0 14px}
  .bank-row .lbl{color:var(--mut); font-size:13px}

  .shelf{margin-top:34px}
  .shelf-head{display:flex; align-items:baseline; gap:12px; margin-bottom:12px}
  .shelf-head h2{margin:0; font-size:22px; font-weight:700; letter-spacing:-.4px}
  .shelf-head button{margin-left:auto; color:var(--mut); font-size:13px; font-weight:600}
  .shelf-head button:hover{color:var(--txt); text-decoration:underline}
  .cards{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px,1fr); gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 -10px; padding:0 0 4px}
  .cards::-webkit-scrollbar{display:none}
  .card{padding:10px; border-radius:8px; text-align:left; transition:background .2s; min-width:150px; max-width:200px}
  .card:hover{background:var(--hover)}
  .card .cv{position:relative}
  .card .art{width:100%; aspect-ratio:1; border-radius:8px; --s:150px; box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .card .fab{position:absolute; right:8px; bottom:8px; opacity:0; translate:0 8px}
  .card:hover .fab,.card:focus-visible .fab,.card[aria-current="true"] .fab{opacity:1; translate:0 0}
  .card .nm{margin-top:10px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card .sb{font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card[aria-current="true"] .nm{color:var(--acc)}
  .fab{width:46px; height:46px; border-radius:50%; background:var(--acc); color:#08090B; display:grid; place-items:center;
    box-shadow:0 8px 18px rgba(0,0,0,.45); transition:opacity .2s, translate .2s, transform .1s}
  .fab:hover{transform:scale(1.06)}
  .fab svg{width:20px; height:20px}

  .genres{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px}
  .genre{position:relative; height:110px; border-radius:8px; overflow:hidden; text-align:left; padding:14px; font-size:20px; font-weight:700; letter-spacing:-.3px;
    background:hsl(var(--g) 62% 42%)}
  .genre::after{content:""; position:absolute; right:-14px; bottom:-10px; width:74px; height:74px; border-radius:8px; rotate:25deg;
    background:linear-gradient(140deg, hsl(calc(var(--g) + 30) 70% 62%), hsl(calc(var(--g) - 20) 60% 30%)); box-shadow:0 6px 18px rgba(0,0,0,.35)}

  /* vista de lista (tipo playlist) */
  .hero{display:flex; align-items:flex-end; gap:24px; padding:20px 0 24px}
  .hero .art{width:200px; height:200px; border-radius:8px; --s:200px; flex:none; box-shadow:0 18px 48px rgba(0,0,0,.55)}
  .hero .kind{font-size:13px; font-weight:500}
  .hero h1{margin:6px 0 10px; font-size:clamp(34px,6vw,72px); font-weight:800; letter-spacing:-2px; line-height:1}
  .hero .meta{color:var(--mut); font-size:14px}
  .actions{display:flex; align-items:center; gap:22px; padding:8px 0 18px}
  .actions .fab{width:56px; height:56px; opacity:1; translate:none}
  .actions .fab svg{width:24px; height:24px}
  .ghost{color:var(--mut); display:flex; align-items:center; gap:8px; font-weight:600}
  .ghost:hover{color:var(--txt)}
  .table{width:100%; border-collapse:collapse}
  .thead{display:grid; grid-template-columns:40px minmax(0,4fr) minmax(0,2fr) 90px; gap:14px; padding:0 14px 8px; border-bottom:1px solid var(--line); color:var(--mut); font-size:13px; margin-bottom:8px}
  .tr{display:grid; grid-template-columns:40px minmax(0,4fr) minmax(0,2fr) 90px; gap:14px; align-items:center; width:100%; padding:6px 14px; border-radius:6px; text-align:left}
  .tr:hover{background:var(--hover)}
  .tr .n{color:var(--mut); text-align:right; font-size:15px; position:relative}
  .tr .n .pl{display:none; position:absolute; right:-4px; top:50%; translate:0 -50%}
  .tr:hover .n .num{visibility:hidden}
  .tr:hover .n .pl{display:block}
  .tr .who{display:flex; align-items:center; gap:12px; min-width:0}
  .tr .art{width:42px; height:42px; border-radius:4px; --s:42px; flex:none}
  .tr .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tr .sb{font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tr .loc,.tr .q{color:var(--mut); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tr .q{text-align:right}
  .tr[aria-current="true"] .nm,.tr[aria-current="true"] .n{color:var(--acc)}
  .note{padding:48px 0; text-align:center; color:var(--mut)}
  .note b{display:block; font-size:18px; color:var(--txt); margin-bottom:6px}
  .sk{background:var(--hover); border-radius:6px; animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.45}}

  /* capa / logo */
  .art{position:relative; display:grid; place-items:center; overflow:hidden; color:#fff; font-weight:700; letter-spacing:-.5px;
    background:linear-gradient(140deg, hsl(var(--h) 68% 56%), hsl(calc(var(--h) + 45) 62% 34%))}
  .art .mono{font-size:calc(var(--s, 48px) * .34); text-shadow:0 1px 3px rgba(0,0,0,.25)}
  .art img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; padding:8%}

  /* ================= painel "a tocar" ================= */
  .np{display:flex; flex-direction:column; overflow-y:auto; scrollbar-width:none}
  .np-top{display:flex; align-items:center; padding:16px 16px 12px; font-weight:700}
  .np-top button{margin-left:auto; width:30px; height:30px; border-radius:50%; color:var(--mut); display:grid; place-items:center}
  .np-top button:hover{background:var(--hover); color:var(--txt)}
  .np-body{padding:0 16px 16px}
  .np-art{width:100%; aspect-ratio:1; border-radius:10px; --s:288px; box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .np-name{margin:16px 0 0; font-size:22px; font-weight:700; letter-spacing:-.4px; line-height:1.2}
  .np-sub{margin-top:2px; color:var(--mut)}
  .np-card{margin-top:18px; background:var(--hover); border-radius:10px; padding:14px}
  .np-card h4{margin:0 0 6px; font-size:13px; color:var(--mut); font-weight:500}
  .np-card .song{font-weight:600; font-size:15px}
  .np-card .song.none{color:var(--mut); font-weight:400; font-size:14px}
  .np-card a{display:inline-flex; margin-top:10px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); font-size:13px; font-weight:600; text-decoration:none}
  .np-card a:hover{border-color:var(--txt)}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tags button{padding:5px 11px; border-radius:999px; background:var(--raise); font-size:12px; font-weight:500}
  .tags button:hover{background:#2D323A}

  /* ================= barra do leitor ================= */
  .player{grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr); align-items:center; gap:16px; padding:0 8px}
  .pl-now{display:flex; align-items:center; gap:12px; min-width:0}
  .pl-now .art{width:56px; height:56px; border-radius:5px; --s:56px; flex:none}
  .pl-now .tx{min-width:0}
  .pl-now .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pl-now .sb{font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pl-now .sb.song{color:var(--acc)}
  .icon-btn{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--mut); flex:none; transition:color .15s, transform .1s}
  .icon-btn:hover{color:var(--txt)}
  .icon-btn:disabled{opacity:.35; cursor:default}
  .icon-btn.on{color:var(--acc)}
  .icon-btn svg{width:18px; height:18px}
  .pl-mid{display:flex; flex-direction:column; align-items:center; gap:6px}
  .pl-ctrl{display:flex; align-items:center; gap:20px}
  .pl-ctrl .icon-btn svg{width:20px; height:20px}
  .bigplay{width:36px; height:36px; border-radius:50%; background:var(--txt); color:var(--black); display:grid; place-items:center; transition:transform .1s}
  .bigplay:hover{transform:scale(1.07)}
  .bigplay:disabled{opacity:.35; cursor:default; transform:none}
  .bigplay svg{width:18px; height:18px}
  .live{display:flex; align-items:center; gap:10px; width:100%; max-width:560px; font-size:11px; color:var(--mut)}
  .live .track{flex:1; height:4px; border-radius:2px; background:var(--raise); overflow:hidden}
  .live .track i{display:block; height:100%; width:0; background:var(--txt); border-radius:2px; transition:width .6s}
  .live.on .track i{width:100%}
  .live .dot{width:6px; height:6px; border-radius:50%; background:var(--dim)}
  .live.on .dot{background:var(--acc); box-shadow:0 0 8px var(--acc); animation:pulse 1.6s infinite}
  .live.busy .track i{width:35%; animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{from{translate:-100% 0}to{translate:300% 0}}
  .pl-right{display:flex; align-items:center; justify-content:flex-end; gap:6px}
  .volume{display:flex; align-items:center; gap:6px; padding-right:8px}
  .volume input{flex:none; width:110px}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:2px; outline:none; cursor:pointer;
    background:linear-gradient(90deg, var(--txt) var(--p,80%), var(--raise) var(--p,80%))}
  input[type=range]:hover{background:linear-gradient(90deg, var(--acc) var(--p,80%), var(--raise) var(--p,80%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--txt); opacity:0}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--txt); border:0}

  .eq{display:inline-flex; gap:2px; align-items:flex-end; height:13px}
  .eq i{width:3px; height:4px; border-radius:1px; background:var(--acc); animation:eq .9s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s}
  @keyframes eq{0%,100%{height:3px}50%{height:13px}}

  /* escolher posição */
  .picker{position:fixed; left:12px; bottom:92px; z-index:30; width:360px; background:var(--raise); border-radius:10px; padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.6); animation:pop .14s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)}}
  .picker-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; font-weight:700}
  .picker-head .chips{padding:0; flex-wrap:nowrap}
  .picker-head .chip{height:28px; padding:0 11px; background:var(--panel)}
  .picker-head .chip[aria-pressed="true"]{background:var(--txt)}
  .pk-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .pk{position:relative; aspect-ratio:1; border-radius:6px; background:var(--panel); border:1px dashed var(--line); font-size:12px; font-weight:600; color:var(--dim); overflow:hidden}
  .pk.filled{border:0}
  .pk .art{position:absolute; inset:0; --s:70px}
  .pk .lab{position:absolute; left:4px; top:4px; z-index:1; font-size:10px; padding:0 5px; border-radius:4px; background:rgba(0,0,0,.6); color:#fff}
  .pk:hover,.pk.here{outline:2px solid var(--acc); outline-offset:-2px}
  .picker-foot{margin-top:10px; font-size:12px; color:var(--mut)}
  .picker-foot button{color:var(--txt); text-decoration:underline; font-size:12px}

  .sleep{position:fixed; right:12px; bottom:92px; z-index:30; width:230px; background:var(--raise); border-radius:10px; padding:8px;
    box-shadow:0 20px 50px rgba(0,0,0,.6); animation:pop .14s ease-out}
  .sleep h4{margin:6px 8px 8px; font-size:13px; color:var(--mut); font-weight:500}
  .sleep button{display:flex; justify-content:space-between; width:100%; padding:9px 10px; border-radius:6px; text-align:left; font-weight:500}
  .sleep button:hover{background:var(--hover)}
  .sleep button[aria-pressed="true"]{color:var(--acc)}
  .sleep-left{font-size:11px; color:var(--acc); white-space:nowrap; margin-right:2px}
  .sg{display:grid; grid-template-columns:56px minmax(0,4fr) minmax(0,2fr) 110px; gap:14px; align-items:center; padding:6px 14px; border-radius:6px}
  .sg:hover{background:var(--hover)}
  .sg .when{color:var(--mut); font-size:13px; text-align:right}
  .sg .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sg .sb{font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sg .st{display:flex; align-items:center; gap:10px; min-width:0; color:var(--mut); font-size:13px}
  .sg .st .art{width:28px; height:28px; border-radius:4px; --s:28px; flex:none}
  .sg .st span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sg a{justify-self:end; font-size:12px; font-weight:600; text-decoration:none; padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:var(--txt); opacity:0; transition:opacity .15s}
  .sg:hover a,.sg a:focus-visible{opacity:1}
  .day{margin:22px 14px 6px; font-size:13px; font-weight:600; color:var(--mut)}
  @media (max-width:560px){ .sg{grid-template-columns:44px minmax(0,1fr) auto} .sg .st{display:none} .sg a{opacity:1} }
  .toast{position:fixed; left:50%; bottom:100px; translate:-50% 12px; opacity:0; pointer-events:none; z-index:40; transition:.2s;
    background:#3B82F6; background:var(--txt); color:var(--black); padding:9px 16px; border-radius:8px; font-weight:600; box-shadow:0 10px 28px rgba(0,0,0,.5)}
  .toast.show{opacity:1; translate:-50% 0}

  /* ================= tamanhos ================= */
  @media (max-width:1200px){ .app:not(.np-off){grid-template-columns:240px minmax(0,1fr)} .np{display:none} #npToggle{display:none} }
  @media (max-width:860px){
    .app,.app.np-off,.app:not(.np-off){grid-template-columns:72px minmax(0,1fr)}
    .brand span,.nav span,.lib-head span,.lib .chips,.li .tx{display:none}
    .side .top{padding:10px 6px} .nav{justify-content:center; padding:10px 0} .lib-head{justify-content:center; padding:14px 0 8px}
    .li{justify-content:center; padding:6px 0}
    .bar .chips{display:none}
    .player{grid-template-columns:minmax(0,1fr) auto} .pl-right{display:none} .live{display:none}
    .hero .art{width:130px; height:130px}
  }
  @media (max-width:560px){
    .app,.app.np-off,.app:not(.np-off){grid-template-columns:1fr; padding:0; gap:0}
    .player{padding:0 12px} #shuffle,#spot,#save{display:none} .pl-ctrl{gap:10px}
    .side{display:none}
    .panel{border-radius:0}
    .content,.bar{padding-left:14px; padding-right:14px}
    .thead{display:none} .tr{grid-template-columns:28px minmax(0,1fr)} .tr .loc,.tr .q{display:none}
    .hero{flex-direction:column; align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ lateral ============ -->
  <aside class="side">
    <div class="panel top">
      <div class="brand"><img src="icon.svg" alt=""><span>Minha Rádio</span></div>
      <button class="nav" id="navHome" aria-current="true"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg><span>Início</span></button>
      <button class="nav" id="navSearch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Procurar</span></button>
      <button class="nav" id="navSongs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Músicas que tocaram</span></button>
    </div>
    <div class="panel lib">
      <div class="lib-head"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h2v18H4zM9 3h2v18H9zM14.2 3.6l1.9-.6 5.4 17.4-1.9.6z"/></svg><span>As minhas memórias</span></div>
      <div class="chips" id="libBanks"></div>
      <div class="lib-list" id="libList"></div>
    </div>
  </aside>

  <!-- ============ principal ============ -->
  <main class="panel main" id="main">
    <div class="bar" id="bar">
      <button class="back" id="back" aria-label="Voltar" disabled><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 5-7 7 7 7"/></svg></button>
      <label class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Que rádio quer ouvir?" autocomplete="off" aria-label="Procurar rádio">
        <button class="clear" id="clear" aria-label="Limpar" hidden>✕</button>
      </label>
      <div class="chips" id="countryChips">
        <button class="chip" data-cc="PT">Portugal</button>
        <button class="chip" data-cc="BR">Brasil</button>
        <button class="chip" data-cc="">Mundo</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- ============ a tocar ============ -->
  <aside class="panel np" id="np">
    <div class="np-top"><span id="npTitle">A tocar</span><button id="npClose" aria-label="Fechar painel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="np-body">
      <div class="art np-art" id="npArt"><span class="mono">♪</span></div>
      <div class="np-name" id="npName">Nada a tocar</div>
      <div class="np-sub" id="npSub">Escolha uma rádio para começar.</div>
      <div class="np-card">
        <h4>Música no ar</h4>
        <div class="song none" id="npSong">Esta rádio não informa a música.</div>
        <a id="npSpot" target="_blank" rel="noopener" hidden>Abrir no Spotify</a>
      </div>
      <div class="np-card">
        <h4>Sobre a estação</h4>
        <div id="npAbout" style="color:var(--mut); font-size:13px; margin-bottom:10px"></div>
        <div class="tags" id="npTags"></div>
      </div>
    </div>
  </aside>

  <!-- ============ leitor ============ -->
  <footer class="player">
    <div class="pl-now">
      <div class="art" id="plArt"><span class="mono">♪</span></div>
      <div class="tx"><div class="nm" id="plName">Nada a tocar</div><div class="sb" id="plSub">Minha Rádio</div></div>
      <button class="icon-btn" id="save" aria-label="Guardar nas memórias" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
    </div>
    <div class="pl-mid">
      <div class="pl-ctrl">
        <button class="icon-btn" id="shuffle" aria-label="Rádio ao acaso" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="icon-btn" id="prev" aria-label="Anterior" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="bigplay" id="play" aria-label="Ligar" disabled>
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="icon-btn" id="next" aria-label="Seguinte" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <a class="icon-btn" id="spot" aria-label="Procurar a música no Spotify" target="_blank" rel="noopener" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></a>
      </div>
      <div class="live" id="live"><span class="dot"></span><span id="liveTxt">Desligado</span><span class="track"><i></i></span><span id="liveQ"></span></div>
    </div>
    <div class="pl-right">
      <span class="sleep-left" id="sleepLeft" hidden></span>
      <button class="icon-btn" id="sleepBtn" aria-label="Timer para dormir" title="Timer para dormir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button class="icon-btn on" id="npToggle" aria-label="Painel a tocar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
      <div class="volume">
        <button class="icon-btn" id="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="volWave" d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <input id="vol" type="range" min="0" max="1" step="0.01" aria-label="Volume">
      </div>
    </div>
  </footer>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker-head"><span>Guardar em</span><div class="chips" id="pkBanks"></div></div>
  <div class="pk-grid" id="pkGrid"></div>
  <div class="picker-foot" id="pkFoot"></div>
</div>
<div class="sleep" id="sleep" hidden>
  <h4>Desligar a rádio daqui a</h4>
  <div id="sleepOpts"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="none"></audio>

<script>
/* ======================= base ======================= */
const SERVERS = ["de1.api.radio-browser.info","fi1.api.radio-browser.info","de2.api.radio-browser.info","nl1.api.radio-browser.info"];
// nome da música: precisa de uma função no servidor; sem ela o app funciona igual, só não mostra a música
const NOWPLAYING = location.hostname.endsWith("netlify.app") ? "/api/nowplaying" : "";
const GENRES = [["Notícias","news",210],["Pop","pop",330],["Rock","rock",0],["Fado","fado",28],["MPB","mpb",150],["Samba","samba",45],
  ["Sertanejo","sertanejo",80],["Jazz","jazz",265],["Clássica","classical",190],["Eletrônica","electronic",290],["Anos 80","80s",310],["Conversa","talk",170]];
const CN = {PT:"Portugal", BR:"Brasil", "":"todo o mundo"};
const BANKS = ["A","B","C","D"], PER = 8;
const $ = s => document.querySelector(s);
const audio = $("#audio");
const store = {
  get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d }catch{ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
const slim = s => s && ({stationuuid:s.stationuuid, name:(s.name||"").trim(), url_resolved:s.url_resolved, favicon:s.favicon||"",
  country:s.country, state:s.state, tags:s.tags, bitrate:s.bitrate, hls:s.hls, codec:s.codec});
const same = (a,b) => !!(a && b && a.stationuuid === b.stationuuid);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let slots = store.get("radio.slots", null);
if (!Array.isArray(slots)){ slots = Array(BANKS.length*PER).fill(null); store.get("radio.favs",[]).slice(0,32).forEach((s,i)=>slots[i]=slim(s)); }
while (slots.length < BANKS.length*PER) slots.push(null);
let bank = store.get("radio.bank", 0);
let recent = store.get("radio.recent", []);
let country = store.get("radio.country", "PT");
let current = store.get("radio.last", null), powered = false, hls = null;
let queue = [];                 // lista de onde a rádio foi tocada (para anterior/seguinte)
let topCache = {}, songT, searchT, lastSong = "";
let view = {name:"home"}, history_ = [];

audio.volume = store.get("radio.vol", .8);
const npOff = store.get("radio.npOff", false);
if (npOff) $("#app").classList.add("np-off");

/* ======================= utilidades ======================= */
function hueOf(n){ let h = 0; for (const c of (n||"")) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function mono(name){
  const stop = /^(r[aá]dio|radio|fm|am|web|the|a|o|de|da|do|das|dos|e|-|–)$/i;
  const w = (name||"").replace(/[()\[\]]/g," ").split(/\s+/).filter(x => x && !stop.test(x));
  if (!w.length) return "♪";
  if (/^\d/.test(w[0])) return w[0].replace(/[^\d.,]/g,"").slice(0,4);
  return (w[0][0] + (w[1] && /^\p{L}/u.test(w[1]) ? w[1][0] : "")).toUpperCase();
}
function art(s, cls = "", size = 48){
  const h = hueOf(s && s.name);
  return `<div class="art ${cls}" style="--h:${h}; --s:${size}px" data-fav="${esc(s && /^https?:/.test(s.favicon) ? s.favicon : "")}"><span class="mono">${esc(s ? mono(s.name) : "♪")}</span></div>`;
}
function hydrate(root = document){
  root.querySelectorAll(".art[data-fav]").forEach(el => {
    const src = el.dataset.fav; el.removeAttribute("data-fav"); if (!src) return;
    // a imagem entra logo no DOM (escondida) para carregar; só aparece se for um logo válido
    const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer"; img.decoding = "async";
    img.style.visibility = "hidden";
    img.onload = () => { if (img.naturalWidth >= 16) img.style.visibility = ""; else img.remove(); };
    img.onerror = () => img.remove();
    img.src = src; el.appendChild(img);
  });
}
function paint(el, s, size){ el.outerHTML; const tmp = document.createElement("div"); tmp.innerHTML = art(s, el.className.replace(/\bart\b/,"").trim(), size); const n = tmp.firstChild; n.id = el.id; el.replaceWith(n); hydrate(n.parentNode); }
const place = s => [s.state, s.country].filter(Boolean).join(", ");
const tagsOf = (s, n = 3) => (s.tags||"").split(",").map(t=>t.trim()).filter(Boolean).slice(0,n);
const slotLabel = i => BANKS[Math.floor(i/PER)] + (i%PER + 1);
const slotOf = s => slots.findIndex(x => same(x,s));
const PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>`;
const EQ = `<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>`;
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 2000); }
async function api(path){
  for (const s of SERVERS){ try{ const r = await fetch(`https://${s}/json/${path}`); if (r.ok) return await r.json(); }catch(e){} }
  throw new Error("offline");
}
function dedupe(list){ const seen = new Set(); return list.filter(s => { const k = (s.name||"").trim().toLowerCase(); if (!s.url_resolved || !k || seen.has(k)) return false; seen.add(k); return true; }).map(slim); }
async function fetchStations({q, tag, cc = country, limit = 150}){
  const p = new URLSearchParams({limit:String(limit), hidebroken:"true", order:"clickcount", reverse:"true"});
  if (q) p.set("name", q); if (cc) p.set("countrycode", cc); if (tag) p.set("tag", tag);
  return dedupe(await api("stations/search?" + p));
}
const isLive = s => powered && same(s, current);

/* ======================= navegação ======================= */
function go(v, push = true){
  if (push) history_.push(view);
  view = v; $("#back").disabled = !history_.length;
  $("#navHome").setAttribute("aria-current", v.name === "home");
  $("#navSearch").setAttribute("aria-current", v.name === "search");
  $("#navSongs").setAttribute("aria-current", v.name === "songs");
  $("#main").scrollTo({top:0});
  render();
}
$("#back").onclick = () => { if (history_.length){ view = history_.pop(); $("#back").disabled = !history_.length; render(); } };
$("#navHome").onclick = () => { $("#q").value = ""; $("#clear").hidden = true; go({name:"home"}); };
$("#navSearch").onclick = () => { $("#q").focus(); if (view.name !== "search") go({name:"search"}); };
$("#main").addEventListener("scroll", () => $("#bar").classList.toggle("solid", $("#main").scrollTop > 40));
function setHeaderHue(h){ $("#main").style.setProperty("--hh", h); }

function render(){
  const c = $("#content");
  if (view.name === "home") renderHome(c);
  else if (view.name === "list") renderList(c);
  else if (view.name === "search") renderSearch(c);
  else if (view.name === "songs") renderSongs(c);
  document.querySelectorAll("#countryChips .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cc === country));
}

/* ---------- início ---------- */
function greeting(){ const h = new Date().getHours(); return h < 6 ? "Boa noite" : h < 12 ? "Bom dia" : h < 20 ? "Boa tarde" : "Boa noite"; }
async function renderHome(c){
  setHeaderHue(current ? hueOf(current.name) : 172);
  c.innerHTML = `
    <h1 class="greet">${greeting()}, Digão</h1>
    <div class="bank-row"><span class="lbl">Memórias</span><div class="chips" style="padding:0" id="homeBanks"></div></div>
    <div class="quick" id="quick"></div>
    ${recent.length ? `<section class="shelf"><div class="shelf-head"><h2>Ouvidas recentemente</h2><button data-open="recent">Mostrar tudo</button></div><div class="cards" id="shRecent"></div></section>` : ""}
    <section class="shelf"><div class="shelf-head"><h2>Mais ouvidas em ${CN[country]}</h2><button data-open="top">Mostrar tudo</button></div><div class="cards" id="shTop">${skCards()}</div></section>
    <section class="shelf"><div class="shelf-head"><h2>Navegar por gênero</h2></div><div class="genres" id="genres"></div></section>`;
  renderQuick();
  if (recent.length) fillCards($("#shRecent"), recent.slice(0,12), recent);
  $("#genres").innerHTML = GENRES.map(([l,t,g]) => `<button class="genre" style="--g:${g}" data-tag="${t}">${l}</button>`).join("");
  c.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go(b.dataset.open === "recent" ? {name:"list", kind:"recent"} : {name:"list", kind:"top"}));
  c.querySelectorAll(".genre").forEach(b => b.onclick = () => go({name:"list", kind:"tag", tag:b.dataset.tag}));
  try{
    const key = country;
    const list = topCache[key] || (topCache[key] = await fetchStations({limit:60}));
    if (view.name === "home" && $("#shTop")) fillCards($("#shTop"), list.slice(0,14), list);
  }catch(e){ if ($("#shTop")) $("#shTop").innerHTML = `<div class="note" style="text-align:left; padding:10px"><b>Sem ligação ao catálogo</b>Confira a internet e volte ao Início.</div>`; }
}
function skCards(){ return Array.from({length:7}, () => `<div class="card"><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="height:12px; margin-top:12px; width:70%"></div></div>`).join(""); }
function fillCards(box, list, q){
  box.innerHTML = list.map((s,i) => `<button class="card" data-i="${i}" aria-current="${same(s,current)}">
     <div class="cv">${art(s,"",150)}<span class="fab">${isLive(s) ? PAUSE : PLAY}</span></div>
     <div class="nm">${esc(s.name)}</div><div class="sb">${esc(place(s) || tagsOf(s,2).join(", "))}</div></button>`).join("");
  hydrate(box);
  box.querySelectorAll(".card").forEach(b => b.onclick = () => { const s = list[+b.dataset.i]; isLive(s) ? stop() : play(s, q); });
}
function renderQuick(){
  const box = $("#quick"); if (!box) return;
  const tabs = $("#homeBanks");
  tabs.innerHTML = BANKS.map((L,bi) => `<button class="chip" data-b="${bi}" aria-pressed="${bi === bank}">Banco ${L}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => setBank(+b.dataset.b));
  const list = slots.slice(bank*PER, bank*PER+PER);
  box.innerHTML = list.map((s,k) => {
    const i = bank*PER + k;
    if (!s) return `<div class="qk empty" data-slot="${i}"><div class="art" style="--s:64px"><span class="mono" style="font-size:14px">${slotLabel(i)}</span></div><span class="nm">Posição livre</span></div>`;
    return `<button class="qk" data-slot="${i}" aria-current="${same(s,current)}" draggable="true">${art(s,"",64)}<span class="nm">${esc(s.name)}</span><span class="tag">${slotLabel(i)}</span><span class="fab">${isLive(s) ? PAUSE : PLAY}</span></button>`;
  }).join("");
  hydrate(box);
  box.querySelectorAll(".qk[data-slot]").forEach(el => wireSlot(el, +el.dataset.slot));
}

/* ---------- vista de lista ---------- */
async function renderList(c){
  const v = view;
  const g = v.kind === "tag" ? GENRES.find(x => x[1] === v.tag) : null;
  const title = v.kind === "recent" ? "Ouvidas recentemente" : v.kind === "top" ? `Mais ouvidas em ${CN[country]}` : v.kind === "query" ? `“${v.q}”` : g ? g[0] : v.tag;
  const kind = v.kind === "tag" ? "Gênero" : v.kind === "query" ? "Resultados da busca" : v.kind === "recent" ? "Histórico" : "Seleção";
  const hue = g ? g[2] : v.kind === "recent" ? 260 : v.kind === "query" ? 200 : 172;
  setHeaderHue(hue);
  c.innerHTML = `
    <div class="hero">
      <div class="art" style="--h:${hue}; --s:200px; width:200px; height:200px; border-radius:8px; box-shadow:0 18px 48px rgba(0,0,0,.55)"><span class="mono" style="font-size:64px">${v.kind === "recent" ? "↺" : v.kind === "query" ? "⌕" : "♫"}</span></div>
      <div><div class="kind">${kind}</div><h1>${esc(title)}</h1><div class="meta" id="lsMeta">A carregar…</div></div>
    </div>
    <div class="actions"><button class="fab" id="playAll" aria-label="Tocar a primeira">${PLAY}</button>
      <button class="ghost" id="shuffleAll"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Ao acaso</button></div>
    <div class="thead"><span style="text-align:right">#</span><span>Rádio</span><span>Local</span><span style="text-align:right">Qualidade</span></div>
    <div id="rows">${Array.from({length:10},()=>`<div class="tr"><span></span><div class="who"><div class="sk" style="width:42px;height:42px"></div><div style="flex:1"><div class="sk" style="height:11px;width:50%"></div></div></div></div>`).join("")}</div>`;
  let list;
  try{
    list = v.kind === "recent" ? recent.slice()
      : v.kind === "top" ? (topCache[country + ":150"] || (topCache[country + ":150"] = await fetchStations({})))
      : v.kind === "query" ? await fetchStations({q:v.q})
      : await fetchStations({tag:v.tag});
  }catch(e){ list = null; }
  if (view !== v) return;
  v.list = list || [];
  const meta = $("#lsMeta");
  if (!list){ meta.textContent = ""; $("#rows").innerHTML = `<div class="note"><b>Sem ligação ao catálogo de rádios</b>Confira a internet e tente de novo.</div>`; return; }
  meta.textContent = `${list.length} ${list.length === 1 ? "estação" : "estações"}${v.kind === "recent" ? "" : " · " + CN[country]}`;
  if (!list.length){
    $("#rows").innerHTML = v.kind === "query"
      ? `<div class="note"><b>Nenhuma rádio chamada “${esc(v.q)}”</b>${country ? "Tente outro nome ou escolha Mundo em cima." : "Tente outro nome."}</div>`
      : `<div class="note"><b>Nada por aqui ainda</b>${v.kind === "recent" ? "As rádios que ouvir aparecem aqui." : "Escolha outro gênero ou país."}</div>`;
    return;
  }
  drawRows(list);
  $("#playAll").onclick = () => { const live = list.find(isLive); live ? stop() : play(list[0], list); };
  $("#shuffleAll").onclick = () => play(list[Math.floor(Math.random()*list.length)], list);
  syncPlayAll();
}
function drawRows(list){
  const box = $("#rows");
  box.innerHTML = list.map((s,i) => `<button class="tr" data-i="${i}" aria-current="${same(s,current)}">
    <span class="n"><span class="num">${isLive(s) ? EQ : i+1}</span><span class="pl">${PLAY}</span></span>
    <div class="who">${art(s,"",42)}<div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="sb">${esc(tagsOf(s,3).join(", ") || "Rádio")}</div></div></div>
    <span class="loc">${esc(place(s))}</span><span class="q">${s.bitrate ? s.bitrate + " kbps" : ""}</span></button>`).join("");
  hydrate(box);
  box.querySelectorAll(".tr").forEach(b => b.onclick = () => play(list[+b.dataset.i], list));
}
function syncPlayAll(){ const b = $("#playAll"); if (b && view.list) b.innerHTML = view.list.some(isLive) ? PAUSE : PLAY; }

/* ---------- busca ---------- */
function renderSearch(c){
  setHeaderHue(200);
  c.innerHTML = `<section class="shelf" style="margin-top:8px"><div class="shelf-head"><h2>Navegar por gênero</h2></div><div class="genres">${GENRES.map(([l,t,g]) => `<button class="genre" style="--g:${g}" data-tag="${t}">${l}</button>`).join("")}</div></section>`;
  c.querySelectorAll(".genre").forEach(b => b.onclick = () => go({name:"list", kind:"tag", tag:b.dataset.tag}));
}
$("#q").addEventListener("input", () => {
  const q = $("#q").value.trim(); $("#clear").hidden = !q;
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    if (q) { if (view.name === "list" && view.kind === "query") go({name:"list", kind:"query", q}, false); else go({name:"list", kind:"query", q}); }
    else go({name:"search"}, false);
  }, 380);
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Escape"){ $("#q").value = ""; $("#clear").hidden = true; $("#q").blur(); go({name:"home"}); }
  if (e.key === "Enter"){ e.preventDefault(); $("#q").blur(); const t = setInterval(() => { if (view.list){ clearInterval(t); view.list[0] && play(view.list[0], view.list); } }, 120); setTimeout(()=>clearInterval(t), 6000); }
});
$("#q").addEventListener("focus", () => { if (view.name === "home") go({name:"search"}); });
$("#clear").onclick = () => { $("#q").value = ""; $("#clear").hidden = true; $("#q").focus(); go({name:"search"}, false); };
document.querySelectorAll("#countryChips .chip").forEach(b => b.onclick = () => { country = b.dataset.cc; store.set("radio.country", country); render(); });

/* ======================= biblioteca (lateral) ======================= */
function setBank(b){ bank = b; store.set("radio.bank", b); renderLib(); renderQuick(); renderPicker(); }
function renderLib(){
  $("#libBanks").innerHTML = BANKS.map((L,bi) => `<button class="chip" data-b="${bi}" aria-pressed="${bi === bank}" aria-label="Banco ${L}" style="min-width:44px">${L}</button>`).join("");
  $("#libBanks").querySelectorAll("button").forEach(b => {
    b.onclick = () => setBank(+b.dataset.b);
    b.ondragover = e => { if (dragFrom >= 0 && +b.dataset.b !== bank){ e.preventDefault(); setBank(+b.dataset.b); } };
  });
  const box = $("#libList");
  box.innerHTML = slots.slice(bank*PER, bank*PER+PER).map((s,k) => {
    const i = bank*PER + k;
    if (!s) return `<div class="li empty" data-slot="${i}"><div class="art" style="--s:48px"><span class="mono" style="font-size:13px">${slotLabel(i)}</span></div><div class="tx"><div class="nm">Posição livre</div></div></div>`;
    return `<button class="li" data-slot="${i}" aria-current="${same(s,current)}" draggable="true">${art(s,"",48)}<div class="tx"><div class="nm">${esc(s.name)}</div><div class="sb">Memória ${slotLabel(i)} · ${esc(s.country || "Rádio")}</div></div>${isLive(s) ? `<span class="vol-ic">${EQ}</span>` : ""}</button>`;
  }).join("");
  hydrate(box);
  box.querySelectorAll("[data-slot]").forEach(el => wireSlot(el, +el.dataset.slot));
}
let dragFrom = -1;
function wireSlot(el, i){
  const s = slots[i];
  if (s){
    el.onclick = () => isLive(s) ? stop() : play(s, slots.filter(Boolean));
    el.ondragstart = e => { dragFrom = i; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    el.ondragend = () => { el.classList.remove("dragging"); dragFrom = -1; };
    el.oncontextmenu = e => { e.preventDefault(); slots[i] = null; saveSlots(); toast(`${slotLabel(i)} ficou livre`); };
    el.title = `${s.name} (clique direito para tirar)`;
  }
  el.ondragover = e => { if (dragFrom >= 0){ e.preventDefault(); el.classList.add("over"); } };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); if (dragFrom < 0 || dragFrom === i) return; [slots[i], slots[dragFrom]] = [slots[dragFrom], slots[i]]; dragFrom = -1; saveSlots(); };
}
function saveSlots(){ store.set("radio.slots", slots); renderLib(); renderQuick(); renderPicker(); syncSave(); }

/* ======================= guardar ======================= */
function renderPicker(){
  $("#pkBanks").innerHTML = BANKS.map((L,bi) => `<button class="chip" data-b="${bi}" aria-pressed="${bi === bank}">${L}</button>`).join("");
  $("#pkBanks").querySelectorAll("button").forEach(b => b.onclick = e => { e.stopPropagation(); setBank(+b.dataset.b); });
  const g = $("#pkGrid");
  g.innerHTML = slots.slice(bank*PER, bank*PER+PER).map((s,k) => {
    const i = bank*PER + k;
    return s ? `<button class="pk filled ${same(s,current) ? "here" : ""}" data-slot="${i}" title="Substituir ${esc(s.name)}">${art(s,"",70)}<span class="lab">${slotLabel(i)}</span></button>`
             : `<button class="pk" data-slot="${i}">${slotLabel(i)}</button>`;
  }).join("");
  hydrate(g);
  g.querySelectorAll(".pk").forEach(b => b.onclick = e => {
    e.stopPropagation(); if (!current) return;
    const i = +b.dataset.slot, prev = slotOf(current);
    if (prev >= 0) slots[prev] = null;
    slots[i] = slim(current); saveSlots(); closePicker(); toast(`Guardada em ${slotLabel(i)}`);
  });
  const at = current ? slotOf(current) : -1;
  $("#pkFoot").innerHTML = at >= 0 ? `Está em ${slotLabel(at)}. Escolha outra posição para mudar, ou <button id="pkRemove">tirar das memórias</button>.` : "Escolha uma posição. Se estiver ocupada, a rádio é substituída.";
  const r = $("#pkRemove"); if (r) r.onclick = e => { e.stopPropagation(); slots[at] = null; saveSlots(); closePicker(); toast("Tirada das memórias"); };
}
function closePicker(){ $("#picker").hidden = true; }
$("#save").onclick = e => { e.stopPropagation(); if ($("#picker").hidden){ renderPicker(); $("#picker").hidden = false; } else closePicker(); };
document.addEventListener("click", e => { if (!$("#picker").hidden && !e.target.closest("#picker")) closePicker(); });
function syncSave(){
  const at = current ? slotOf(current) : -1;
  $("#save").disabled = !current;
  $("#save").classList.toggle("on", at >= 0);
  $("#save").innerHTML = at >= 0
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="m7.5 12 3 3 6-6" fill="none" stroke="#08090B" stroke-width="2.4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`;
  $("#save").setAttribute("aria-label", at >= 0 ? `Na memória ${slotLabel(at)}` : "Guardar nas memórias");
  $("#save").title = at >= 0 ? `Na memória ${slotLabel(at)}` : "Guardar nas memórias";
}

/* ======================= tocar ======================= */
function play(s, list, isRetry){
  if (!s) return;
  if (!isRetry){ retries = 0; clearTimeout(retryT); }
  if (list) queue = list;
  if (!same(s,current)) lastSong = "";
  powered = true; current = s;
  if (hls){ hls.destroy(); hls = null; }
  let url = s.url_resolved;
  const upgraded = location.protocol === "https:" && url.startsWith("http:");
  if (upgraded) url = "https:" + url.slice(5);
  audio.dataset.upgraded = upgraded ? "1" : "";
  const isHls = s.hls == 1 || /\.m3u8(\?|$)/i.test(url);
  if (isHls && window.Hls && Hls.isSupported() && !audio.canPlayType("application/vnd.apple.mpegurl")){
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(audio);
    hls.on(Hls.Events.ERROR, (ev, d) => { if (d.fatal && powered && !reconnect()){ powered = false; setState("off", "Esta rádio não respondeu"); } });
  } else audio.src = url;
  audio.play().catch(()=>{});
  store.set("radio.last", s);
  recent = [slim(s), ...recent.filter(r => !same(r,s))].slice(0,30); store.set("radio.recent", recent);
  setState("busy");
  pollSong(true);
  api("url/" + s.stationuuid).catch(()=>{});
}
function stop(){ clearTimeout(retryT); clearTimeout(stallT); retries = 0; powered = false; clearTimeout(songT); audio.pause(); if (hls){ hls.destroy(); hls = null; } audio.removeAttribute("src"); audio.load(); setState("off"); }
function toggle(){ if (current) powered ? stop() : play(current); }
function step(d){
  const q = queue.length ? queue : [];
  if (!q.length) return;
  let i = q.findIndex(s => same(s,current));
  play(q[(i < 0 ? 0 : i + d + q.length) % q.length]);
}
let state = "off";
function setState(k, msg){
  state = k;
  const on = k === "on" || k === "busy";
  $("#icoPlay").toggleAttribute("hidden", on); $("#icoPause").toggleAttribute("hidden", !on);
  $("#play").setAttribute("aria-label", on ? "Desligar" : "Ligar");
  $("#live").className = "live" + (k === "on" ? " on" : k === "busy" ? " busy" : "");
  $("#liveTxt").textContent = msg || (k === "on" ? "Ao vivo" : k === "busy" ? "A sintonizar…" : "Desligado");
  document.title = k === "on" && current ? "▶ " + current.name : "Minha Rádio";
  refreshNow(); refreshMarks();
}
/* ---- reconexão automática ---- */
let retries = 0, retryT, stallT;
const RETRY_WAIT = [2, 4, 8, 15, 30];
function reconnect(){
  clearTimeout(retryT); clearTimeout(stallT);
  if (!powered || !current) return false;
  if (retries >= RETRY_WAIT.length) return false;
  const wait = RETRY_WAIT[retries++];
  setState("busy", navigator.onLine === false ? "Sem internet. A aguardar ligação…" : `Ligação perdida. A reconectar (${retries}/${RETRY_WAIT.length})…`);
  retryT = setTimeout(() => { if (powered && current) play(current, null, true); }, wait*1000);
  return true;
}
audio.addEventListener("playing", () => { retries = 0; clearTimeout(stallT); clearTimeout(retryT); setState("on"); });
audio.addEventListener("waiting", () => {
  if (!powered) return; setState("busy");
  clearTimeout(stallT); stallT = setTimeout(() => { if (powered && audio.paused === false && audio.readyState < 3) reconnect(); }, 15000);
});
audio.addEventListener("stalled", () => { if (powered){ clearTimeout(stallT); stallT = setTimeout(() => { if (powered && audio.readyState < 3) reconnect(); }, 15000); } });
audio.addEventListener("ended", () => { if (powered) reconnect(); });
window.addEventListener("online", () => { if (powered && state !== "on"){ retries = 0; clearTimeout(retryT); play(current, null, true); } });
audio.addEventListener("error", () => {
  if (!powered || !audio.getAttribute("src")) return;
  if (!audio.dataset.upgraded && state === "on" && reconnect()) return;   // estava a tocar e caiu: tenta de novo
  if (!audio.dataset.upgraded && retries > 0 && reconnect()) return;
  powered = false; retries = 0;
  setState("off", audio.dataset.upgraded ? "Só toca no arquivo radio.html (rádio sem https)" : "Esta rádio não respondeu");
  toast(audio.dataset.upgraded ? "Esta rádio só transmite sem segurança. Abra-a no arquivo radio.html." : "Esta rádio não respondeu. Experimente outra.");
});

function refreshNow(){
  const s = current;
  ["#play","#prev","#next","#shuffle"].forEach(id => $(id).disabled = !s);
  syncSave();
  if (!s) return;
  document.documentElement.style.setProperty("--hue", hueOf(s.name));
  if ($("#plArt").dataset.id !== s.stationuuid){
    paint($("#plArt"), s, 56); $("#plArt").dataset.id = s.stationuuid;
    paint($("#npArt"), s, 288); $("#npArt").dataset.id = s.stationuuid;
  }
  $("#plName").textContent = s.name;
  const sub = $("#plSub");
  sub.textContent = lastSong || place(s) || "Rádio";
  sub.classList.toggle("song", !!lastSong);
  $("#liveQ").textContent = s.bitrate ? s.bitrate + " kbps" : "";
  $("#npTitle").textContent = powered ? "A tocar" : "Última rádio";
  $("#npName").textContent = s.name;
  $("#npSub").textContent = place(s) || "Rádio";
  $("#npSong").textContent = lastSong || (powered ? "Esta rádio não informa a música." : "Ligue a rádio para ver a música.");
  $("#npSong").classList.toggle("none", !lastSong);
  const spot = lastSong ? "https://open.spotify.com/search/" + encodeURIComponent(lastSong.replace(/\s-\s/," ")) : "";
  $("#npSpot").hidden = !spot; $("#npSpot").href = spot || "#";
  $("#spot").style.visibility = spot ? "visible" : "hidden"; $("#spot").href = spot || "#";
  const at = slotOf(s);
  $("#npAbout").textContent = [s.bitrate ? s.bitrate + " kbps" : "", s.codec, at >= 0 ? "na memória " + slotLabel(at) : ""].filter(Boolean).join(" · ") || "Rádio ao vivo";
  $("#npTags").innerHTML = tagsOf(s, 6).map(t => `<button data-tag="${esc(t)}">${esc(t)}</button>`).join("");
  $("#npTags").querySelectorAll("button").forEach(b => b.onclick = () => go({name:"list", kind:"tag", tag:b.dataset.tag}));
  mediaMeta();
}
function refreshMarks(){
  renderLib(); renderQuick();
  document.querySelectorAll(".card[data-i], .tr[data-i]").forEach(el => {
    const box = el.closest("#rows, .cards"); if (!box) return;
  });
  // redesenha as listas visíveis para atualizar o equalizador
  if (view.name === "list" && view.list && view.list.length) { drawRows(view.list); syncPlayAll(); }
  if (view.name === "home"){
    if ($("#shRecent")) fillCards($("#shRecent"), recent.slice(0,12), recent);
    const top = topCache[country]; if (top && $("#shTop")) fillCards($("#shTop"), top.slice(0,14), top);
  }
}

/* ======================= música a tocar ======================= */
async function pollSong(first){
  clearTimeout(songT);
  if (!powered || !current || !NOWPLAYING) return;
  const s = current;
  try{
    const r = await fetch(NOWPLAYING + "?url=" + encodeURIComponent(s.url_resolved));
    const { title } = await r.json();
    if (same(s,current)){ const t = clean(title, s.name); if (t !== lastSong){ lastSong = t; logSong(t, s); refreshNow(); } }
  }catch(e){}
  songT = setTimeout(() => pollSong(false), first ? 12000 : 20000);
}
function clean(t, station){
  if (!t) return ""; t = t.replace(/\s+/g," ").trim();
  if (t.length < 3 || /^[-\d\s]+$/.test(t) || t.toLowerCase() === (station||"").toLowerCase() || /^(https?:|www\.)/i.test(t)) return "";
  return t;
}
function mediaMeta(){
  if (!("mediaSession" in navigator) || !current) return;
  try{
    let title = current.name, artist = "Minha Rádio";
    if (lastSong){ const [a,...r] = lastSong.split(" - "); if (r.length){ artist = a + " · " + current.name; title = r.join(" - "); } else { title = lastSong; artist = current.name; } }
    navigator.mediaSession.metadata = new MediaMetadata({title, artist, artwork: /^https?:/.test(current.favicon) ? [{src:current.favicon}] : [{src:"icon-512.png", sizes:"512x512"}]});
    navigator.mediaSession.setActionHandler("play", () => play(current));
    navigator.mediaSession.setActionHandler("pause", stop);
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  }catch(e){}
}

/* ======================= músicas que tocaram ======================= */
let songs = store.get("radio.songs", []);
function logSong(t, s){
  if (!t) return;
  const last = songs[0];
  if (last && last.t === t && last.id === s.stationuuid) return;
  songs.unshift({t, id:s.stationuuid, st:s.name, fav:s.favicon || "", at:Date.now()});
  songs = songs.slice(0, 300); store.set("radio.songs", songs);
  if (view.name === "songs") render();
}
function dayLabel(ts){
  const d = new Date(ts), today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - new Date(d).setHours(0,0,0,0)) / 864e5);
  return diff === 0 ? "Hoje" : diff === 1 ? "Ontem" : d.toLocaleDateString("pt-PT", {weekday:"long", day:"numeric", month:"long"});
}
function renderSongs(c){
  setHeaderHue(330);
  c.innerHTML = `
    <div class="hero">
      <div class="art" style="--h:330; --s:200px; width:200px; height:200px; border-radius:8px; box-shadow:0 18px 48px rgba(0,0,0,.55)"><span class="mono" style="font-size:64px">♪</span></div>
      <div><div class="kind">Histórico</div><h1>Músicas que tocaram</h1><div class="meta">${songs.length ? `${songs.length} ${songs.length === 1 ? "música" : "músicas"} · só das rádios que informam a música` : "Aparecem aqui enquanto ouve rádio"}</div></div>
    </div>
    ${songs.length ? `<div class="actions"><button class="ghost" id="clearSongs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Limpar histórico</button></div>` : ""}
    <div id="songRows"></div>`;
  if (!songs.length){
    $("#songRows").innerHTML = `<div class="note"><b>Ainda não há músicas</b>Ligue uma rádio. Sempre que ela informar o nome da música, fica guardado aqui com a hora.</div>`;
    return;
  }
  let html = "", lastDay = "";
  songs.forEach(x => {
    const dl = dayLabel(x.at);
    if (dl !== lastDay){ html += `<div class="day">${esc(dl[0].toUpperCase() + dl.slice(1))}</div>`; lastDay = dl; }
    const [a, ...r] = x.t.split(" - ");
    const title = r.length ? r.join(" - ") : x.t, artist = r.length ? a : "";
    const hm = new Date(x.at).toLocaleTimeString("pt-PT", {hour:"2-digit", minute:"2-digit"});
    html += `<div class="sg"><span class="when">${hm}</span>
      <div style="min-width:0"><div class="nm">${esc(title)}</div><div class="sb">${esc(artist || "—")}</div></div>
      <div class="st">${art({name:x.st, favicon:x.fav}, "", 28)}<span>${esc(x.st)}</span></div>
      <a href="https://open.spotify.com/search/${encodeURIComponent(x.t.replace(/\s-\s/," "))}" target="_blank" rel="noopener">Spotify</a></div>`;
  });
  $("#songRows").innerHTML = html; hydrate($("#songRows"));
  const cl = $("#clearSongs");
  if (cl) cl.onclick = () => {
    if (cl.dataset.sure){ songs = []; store.set("radio.songs", songs); render(); toast("Histórico limpo"); }
    else { cl.dataset.sure = "1"; cl.lastChild.textContent = "Clique de novo para confirmar"; setTimeout(() => { if (cl.isConnected){ delete cl.dataset.sure; cl.lastChild.textContent = "Limpar histórico"; } }, 3000); }
  };
}
$("#navSongs").onclick = () => go({name:"songs"});

/* ======================= timer para dormir ======================= */
let sleepEnd = 0, sleepTick, sleepVol = null;
const SLEEP_OPTS = [15, 30, 45, 60, 90];
function renderSleep(){
  const box = $("#sleepOpts");
  box.innerHTML = SLEEP_OPTS.map(m => `<button data-m="${m}" aria-pressed="false"><span>${m} minutos</span></button>`).join("")
    + (sleepEnd ? `<button data-m="0"><span>Desligar o timer</span></button>` : "");
  box.querySelectorAll("button").forEach(b => b.onclick = e => { e.stopPropagation(); setSleep(+b.dataset.m); $("#sleep").hidden = true; });
}
function setSleep(min){
  clearInterval(sleepTick);
  if (sleepVol !== null){ audio.volume = sleepVol; sleepVol = null; volUI(); }
  sleepEnd = min ? Date.now() + min*60000 : 0;
  $("#sleepBtn").classList.toggle("on", !!sleepEnd);
  if (!sleepEnd){ $("#sleepLeft").hidden = true; toast("Timer desligado"); return; }
  toast(`A rádio desliga daqui a ${min} minutos`);
  if (!powered && current) play(current);
  tickSleep(); sleepTick = setInterval(tickSleep, 1000);
}
function tickSleep(){
  const left = sleepEnd - Date.now();
  if (left <= 0){
    clearInterval(sleepTick); sleepEnd = 0; stop();
    if (sleepVol !== null){ audio.volume = sleepVol; sleepVol = null; volUI(); }
    $("#sleepBtn").classList.remove("on"); $("#sleepLeft").hidden = true; return;
  }
  // no último minuto o volume vai baixando devagar
  if (left < 60000 && powered){ if (sleepVol === null) sleepVol = audio.volume; audio.volume = sleepVol * (left / 60000); }
  const m = Math.ceil(left / 60000);
  $("#sleepLeft").hidden = false;
  $("#sleepLeft").textContent = left < 60000 ? `${Math.ceil(left/1000)} s` : `${m} min`;
}
$("#sleepBtn").onclick = e => { e.stopPropagation(); renderSleep(); $("#sleep").hidden = !$("#sleep").hidden; };
document.addEventListener("click", e => { if (!$("#sleep").hidden && !e.target.closest("#sleep")) $("#sleep").hidden = true; });

/* ======================= controles ======================= */
let lastVol = audio.volume || .8;
function volUI(){ $("#vol").value = audio.volume; $("#vol").style.setProperty("--p", audio.volume*100 + "%"); $("#volWave").style.opacity = audio.volume ? 1 : 0; }
$("#vol").oninput = e => { sleepVol = null; audio.volume = +e.target.value; if (audio.volume) lastVol = audio.volume; store.set("radio.vol", audio.volume); volUI(); };
$("#mute").onclick = () => { audio.volume = audio.volume ? 0 : lastVol; store.set("radio.vol", audio.volume); volUI(); };
$("#play").onclick = toggle;
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#shuffle").onclick = () => { const q = queue.length ? queue : (topCache[country] || []); if (q.length > 1){ let s; do s = q[Math.floor(Math.random()*q.length)]; while (same(s,current)); play(s, q); } };
function setNp(off){ $("#app").classList.toggle("np-off", off); $("#npToggle").classList.toggle("on", !off); store.set("radio.npOff", off); }
$("#npToggle").onclick = () => setNp(!$("#app").classList.contains("np-off"));
$("#npClose").onclick = () => setNp(true);
$("#npToggle").classList.toggle("on", !npOff);

document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Escape" && !$("#picker").hidden){ closePicker(); return; }
  if (e.key === "Escape" && !$("#sleep").hidden){ $("#sleep").hidden = true; return; }
  if (t.tagName === "INPUT" && t.type !== "range") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Space" && t.tagName !== "BUTTON"){ e.preventDefault(); toggle(); }
  else if (/^[1-8]$/.test(e.key)){ const s = slots[bank*PER + (+e.key-1)]; if (s) play(s, slots.filter(Boolean)); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ if (t.type === "range") return; e.preventDefault(); step(e.key === "ArrowRight" ? 1 : -1); }
  else if (e.key === "/"){ e.preventDefault(); $("#q").focus(); }
});

/* ======================= início ======================= */
volUI(); renderLib(); refreshNow(); go({name:"home"}, false);
if (current) setState("off", "Carregue em ▶ para ouvir");
</script>
